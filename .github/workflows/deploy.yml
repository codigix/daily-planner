name: CI/CD VPS Auto Deployment

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend & Backend Dependencies
        run: |
          npm --prefix frontend install
          npm --prefix backend install

      - name: Build Frontend Bundle
        run: |
          npm --prefix frontend run build

  deploy-to-vps:
    name: Deploy to VPS Server
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🚀 Starting Deployment on VPS Server..."
            
            cd /var/www/daily-planner
            
            echo "📥 Pulling latest changes..."
            git pull origin main
            
            echo "📦 Building Frontend..."
            cd frontend
            npm i
            npm run build
            
            echo "⚡ Installing Backend Dependencies & Restarting PM2..."
            cd ../backend
            npm i
            pm2 restart daily-planner-backend
            
            echo "🎉 Deployment Completed Successfully!"
